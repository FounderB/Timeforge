[package]
name = "timeforge"
version = "0.2.1"
edition = "2021"
description = "Repo Time Machine for GitHub — see what changed, who owns it, and why it broke"
license = "MIT"
authors = ["FounderB"]
repository = "https://github.com/FounderB/Timeforge"
readme = "README.md"
keywords = ["git", "github", "blame", "timeline", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
comfy-table = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "timeforge"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
