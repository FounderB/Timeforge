<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Timeforge — Repo Time Machine</title>
<style>
:root{
  --bg:#070b10;--panel:#0d1520;--panel2:#0a121b;--line:#1c2e3f;--text:#e8f2f7;
  --muted:#6d8798;--accent:#5eead4;--accent2:#38bdf8;--warn:#fbbf24;--bad:#fb7185;
  --hover:#122033;--sel:#0f2a2a;
  --c0:#5eead4;--c1:#38bdf8;--c2:#a78bfa;--c3:#f472b6;--c4:#fbbf24;--c5:#34d399;--c6:#fb7185;--c7:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#122033 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding:1.25rem 1.5rem 2rem}
.hero{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:1rem}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 8px 28px rgba(56,189,248,.35)}
h1{font-size:1.55rem;letter-spacing:-.03em;font-weight:700}
.tag{color:var(--muted);font-size:.8rem;margin-top:.15rem}
.kbd{font-size:.65rem;color:var(--muted);border:1px solid var(--line);padding:.1rem .35rem;border-radius:4px;margin-left:.35rem}
.open-row{display:flex;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
.open-row input{flex:1;min-width:220px;background:#081018;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:.55rem .75rem;font-size:.8rem}
.open-row button{border:none;border-radius:10px;padding:.55rem .9rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062018;font-size:.8rem}
.open-row button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.open-row button.ghost:hover{color:var(--text);border-color:var(--accent)}
.chips{margin-bottom:.65rem;min-height:1.2rem}
.chip{display:inline-flex;align-items:center;gap:.25rem;margin:.15rem .25rem .15rem 0;padding:.25rem .55rem;border-radius:999px;border:1px solid var(--line);font-size:.68rem;color:var(--muted);cursor:pointer}
.chip:hover,.chip.on{color:var(--text);border-color:var(--accent)}
.chip .x{opacity:.5}
.tabs{display:flex;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:.4rem .75rem;border-radius:999px;cursor:pointer;font-size:.72rem;font-weight:600}
.tab.active{color:#062018;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.layout{display:grid;grid-template-columns:300px 210px 1fr;gap:.85rem;align-items:start}
@media(max-width:1100px){.layout{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.layout{grid-template-columns:1fr}}
.panel{background:rgba(13,21,32,.92);border:1px solid var(--line);border-radius:16px;padding:.9rem;min-height:440px}
.panel h2{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.65rem}
.meta{font-size:.75rem;color:var(--muted);margin-bottom:.65rem;word-break:break-all}
label{display:block;font-size:.72rem;color:var(--muted);margin:.5rem 0 .25rem}
input.ctrl{width:100%;background:#081018;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:.5rem .65rem;font-size:.8rem}
button.primary{margin-top:.75rem;width:100%;border:none;border-radius:10px;padding:.65rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062018}
button.mini{margin-top:.4rem;width:100%;border:1px solid var(--line);border-radius:8px;padding:.4rem;background:transparent;color:var(--muted);cursor:pointer;font-size:.72rem}
button.mini:hover{color:var(--text);border-color:var(--accent)}
.crumb{display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;margin-bottom:.55rem;font-size:.72rem}
.crumb button{background:transparent;border:none;color:var(--accent2);cursor:pointer;padding:.1rem .25rem;border-radius:4px;font:inherit}
.crumb button:hover{background:var(--hover)}
.crumb .sep{color:var(--muted)}
.tree{max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.row{display:flex;align-items:center;gap:.4rem;padding:.36rem .5rem;cursor:pointer;font-size:.78rem;border-bottom:1px solid #121c28;user-select:none}
.row:last-child{border-bottom:none}
.row:hover,.row.focus{background:var(--hover)}
.row.active{background:var(--sel);outline:1px solid #1a4a4a}
.row .ic{width:1.2rem;text-align:center;flex-shrink:0}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.row .spark{font-size:.58rem;color:var(--accent);font-family:ui-monospace,monospace;min-width:1.6rem;text-align:right}
.row .kd{font-size:.58rem;color:var(--muted);text-transform:uppercase}
.event{padding:.55rem 0;border-bottom:1px dashed #1a2a38}
.event .h{font-family:ui-monospace,monospace;color:var(--accent);font-size:.72rem}
.event .s{font-size:.8rem;margin-top:.15rem}
.bar{height:8px;border-radius:99px;background:#13202c;overflow:hidden;margin:.25rem 0 .45rem}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.owner{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem}
.warn{margin:.6rem 0;padding:.6rem .7rem;border-radius:10px;border:1px solid #fbbf2444;background:#fbbf2411;color:var(--warn);font-size:.75rem}
.empty{color:var(--muted);font-size:.82rem;padding:.5rem 0}
.score{display:inline-block;min-width:2rem;text-align:center;padding:.1rem .3rem;border-radius:6px;background:#fb718522;color:var(--bad);font-weight:700;font-size:.72rem}
.path-pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:8px;background:#0f1c28;border:1px solid var(--line);font-family:ui-monospace,monospace;font-size:.72rem;color:var(--accent)}
.strip{display:flex;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:.5rem 0 .8rem}
.strip span{display:block;height:100%;min-width:2px}
.block{padding:.45rem 0;border-bottom:1px dashed #1a2a38;cursor:pointer}
.block:hover{background:var(--hover)}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.risk-high{color:var(--bad)}.risk-medium{color:var(--warn)}.risk-watch{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>Timeforge</h1>
        <div class="tag">Bug hunt · radar · archaeology · FounderB <span class="kbd">j/k</span> <span class="kbd">h</span> <span class="kbd">u</span></div>
      </div>
    </div>
    <div class="meta" id="repoInfo" style="margin:0;text-align:right">Loading…</div>
  </div>

  <div class="open-row">
    <input id="remoteSpec" placeholder="Open remote: FounderB/SignShield or rust-lang/mdBook"/>
    <button id="btnOpen">Open</button>
    <button class="ghost" id="btnUpdate" title="git fetch + pull — sync to latest">Update</button>
    <button class="ghost" id="btnRepair">Repair</button>
  </div>
  <div class="chips" id="cached"></div>
  <div class="chips" id="pins"></div>

  <div class="tabs">
    <button class="tab active" data-v="hunt">Bug Hunt</button>
    <button class="tab" data-v="timeline">Time Machine</button>
    <button class="tab" data-v="map">Blame Map</button>
    <button class="tab" data-v="dig">Archaeology</button>
    <button class="tab" data-v="pairs">Fix↔Break</button>
    <button class="tab" data-v="pr">PR Travel</button>
    <button class="tab" data-v="ghosts">Ghosts</button>
    <button class="tab" data-v="why">Why broke</button>
    <button class="tab" data-v="heatmap">Heatmap</button>
    <button class="tab" data-v="blast">Blast</button>
    <button class="tab" data-v="hotspots">Hotspots</button>
    <button class="tab" data-v="stale">Stale</button>
    <button class="tab" data-v="contributors">Contributors</button>
    <button class="tab" data-v="churn">Churn</button>
  </div>

  <div class="layout">
    <section class="panel">
      <h2>Files</h2>
      <div class="crumb" id="crumb"></div>
      <div class="tree" id="tree" tabindex="0"><div class="empty">Loading tree…</div></div>
    </section>

    <section class="panel">
      <h2>Controls</h2>
      <label>Selected path</label>
      <input class="ctrl" id="path" value="README.md"/>
      <label>Keyword / PR # / pattern</label>
      <input class="ctrl" id="query" placeholder="promisor · unwrap · #12 · panic…"/>
      <button class="primary" id="run">Run hunt</button>
      <button class="mini" id="btnPin">Pin path</button>
      <p class="meta" style="margin-top:.85rem"><b>h</b> hunt · <b>u</b> update · <b>b</b> map · Dig finds first-seen code</p>
    </section>

    <section class="panel">
      <h2 id="outTitle">Bug Hunt</h2>
      <div id="selPath" class="path-pill" style="margin-bottom:.7rem">README.md</div>
      <div id="out" class="empty">Pick a file and hit Run</div>
    </section>
  </div>
</div>
<script>
const COLORS=['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
let view='hunt';
let treePath='';
let selectedPath='README.md';
let treeRows=[];
let focusIdx=-1;
const titles={hunt:'Bug Hunt',timeline:'Timeline',map:'Blame Map',dig:'Archaeology',pairs:'Fix↔Break',pr:'PR Travel',ghosts:'Ghost authors',why:'Suspects',heatmap:'Ownership',blast:'Co-changes',hotspots:'Hotspots',stale:'Stale files',contributors:'Contributors',churn:'Weekly churn'};

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pins(){try{return JSON.parse(localStorage.getItem('tf_pins')||'[]')}catch{return[]}}
function savePins(p){localStorage.setItem('tf_pins',JSON.stringify(p.slice(0,12)));renderPins()}
function renderPins(){
  const el=document.getElementById('pins');
  const list=pins();
  if(!list.length){el.innerHTML='';return}
  el.innerHTML='<span class="meta" style="margin-right:.4rem">Pinned</span>'+list.map(p=>`<span class="chip on" data-p="${esc(p)}">${esc(p)} <span class="x" data-x="${esc(p)}">×</span></span>`).join('');
  el.querySelectorAll('.chip').forEach(c=>{
    c.onclick=e=>{
      if(e.target.dataset.x){savePins(pins().filter(x=>x!==e.target.dataset.x));return}
      setSelected(c.dataset.p);
      const dir=c.dataset.p.includes('/')?c.dataset.p.replace(/\/[^/]+$/,''):'';
      loadTree(dir).then(run);
    };
  });
}

function setView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.getElementById('outTitle').textContent=titles[v]||v;
  syncHash();
  run();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));

function setSelected(p){
  selectedPath=p||'';
  document.getElementById('path').value=selectedPath;
  document.getElementById('selPath').textContent=selectedPath||'(repo root)';
  syncHash();
}

function syncHash(){
  const q=new URLSearchParams();
  if(selectedPath) q.set('path',selectedPath);
  if(view&&view!=='timeline') q.set('view',view);
  const qq=document.getElementById('query').value.trim();
  if(qq) q.set('q',qq);
  const s=q.toString();
  history.replaceState(null,'',s?'?'+s:location.pathname);
}

async function info(){
  const d=await fetch('/api/info').then(r=>r.json());
  document.getElementById('repoInfo').textContent=(d.repo||'')+' · v'+(d.version||'');
}

async function loadCached(){
  const list=await fetch('/api/repos').then(r=>r.json()).catch(()=>[]);
  const el=document.getElementById('cached');
  if(!Array.isArray(list)||!list.length){el.innerHTML='';return}
  el.innerHTML=list.map(r=>{
    const spec=(r.remote||r.id).replace('https://github.com/','').replace(/\.git$/,'');
    return `<span class="chip" data-spec="${esc(spec)}">${esc(r.id)}</span>`;
  }).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.getElementById('remoteSpec').value=c.dataset.spec;openRemote(false)});
}

function renderCrumb(path){
  const el=document.getElementById('crumb');
  const parts=path?path.split('/').filter(Boolean):[];
  let html=`<button type="button" data-p="">root</button>`;
  let acc='';
  parts.forEach(p=>{acc=acc?acc+'/'+p:p;html+=`<span class="sep">/</span><button type="button" data-p="${esc(acc)}">${esc(p)}</button>`});
  el.innerHTML=html;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>loadTree(b.dataset.p||''));
}

function spark(n){
  if(n==null) return '';
  if(n<=0) return '·';
  if(n<3) return '▂';
  if(n<8) return '▃';
  if(n<15) return '▅';
  return '▇';
}

async function loadTree(path){
  treePath=path||'';
  renderCrumb(treePath);
  const el=document.getElementById('tree');
  el.innerHTML='<div class="empty">Loading…</div>';
  try{
    const d=await fetch('/api/tree?churn=1&path='+encodeURIComponent(treePath)).then(r=>r.json());
    if(d.error) throw new Error(d.error);
    treeRows=[];
    const html=[];
    if(d.parent!==null&&d.parent!==undefined){
      treeRows.push({kind:'up',path:d.parent||'',name:'..'});
      html.push(`<div class="row" data-i="0"><span class="ic">⬆️</span><span class="nm">..</span><span class="kd">up</span></div>`);
    }
    for(const e of (d.entries||[])){
      const i=treeRows.length;
      treeRows.push(e);
      const active=e.path===selectedPath?' active':'';
      html.push(`<div class="row${active}" data-i="${i}"><span class="ic">${e.icon||'📄'}</span><span class="nm">${esc(e.name)}</span><span class="spark">${spark(e.commits)}</span><span class="kd">${e.kind==='tree'?'dir':'file'}</span></div>`);
    }
    el.innerHTML=html.join('')||'<div class="empty">Empty folder</div>';
    focusIdx=treeRows.findIndex(r=>r.path===selectedPath);
    paintFocus();
    el.querySelectorAll('.row').forEach(row=>{
      row.onclick=()=>activateRow(+row.dataset.i);
    });
  }catch(e){el.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'}
}

function paintFocus(){
  document.querySelectorAll('#tree .row').forEach(r=>{
    r.classList.toggle('focus',+r.dataset.i===focusIdx);
  });
  const f=document.querySelector('#tree .row.focus');
  if(f) f.scrollIntoView({block:'nearest'});
}

function activateRow(i){
  const e=treeRows[i];
  if(!e) return;
  focusIdx=i;
  paintFocus();
  if(e.kind==='up'||e.kind==='tree'){
    loadTree(e.path||'');
  } else {
    setSelected(e.path);
    document.querySelectorAll('#tree .row').forEach(x=>x.classList.remove('active'));
    document.querySelector(`#tree .row[data-i="${i}"]`)?.classList.add('active');
    if(['heatmap','hotspots','stale','contributors','churn','ghosts'].includes(view)) setView('timeline');
    else run();
  }
}

async function openRemote(repair){
  const spec=document.getElementById('remoteSpec').value.trim();
  if(!spec) return alert('Paste owner/repo');
  document.getElementById('out').innerHTML='<div class="empty">'+(repair?'Repairing':'Opening')+' '+esc(spec)+'…</div>';
  const r=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spec,repair:!!repair})});
  const d=await r.json();
  if(d.error){alert(d.error);return}
  treePath=''; setSelected('README.md');
  await info(); await loadCached(); await loadTree(''); await run();
}

document.getElementById('btnOpen').onclick=()=>openRemote(false);
document.getElementById('btnRepair').onclick=()=>openRemote(true);
document.getElementById('btnUpdate').onclick=async()=>{
  document.getElementById('out').innerHTML='<div class="empty">Updating from remote…</div>';
  try{
    const r=await fetch('/api/update',{method:'POST'});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    await info(); await loadTree(treePath); await run();
    alert(d.message||'updated');
  }catch(e){alert(e.message||e)}
};
document.getElementById('btnPin').onclick=()=>{
  if(!selectedPath) return;
  const p=pins();
  if(!p.includes(selectedPath)) p.unshift(selectedPath);
  savePins(p);
};

async function run(){
  const pathVal=document.getElementById('path').value.trim();
  if(pathVal) setSelected(pathVal);
  const path=encodeURIComponent(selectedPath||'README.md');
  const q=encodeURIComponent(document.getElementById('query').value.trim());
  syncHash();
  const out=document.getElementById('out');
  out.innerHTML='<div class="empty">Loading…</div>';
  try{
    if(view==='hunt'){
      const qq=document.getElementById('query').value.trim()||selectedPath||'fix';
      const d=await fetch('/api/hunt?q='+encodeURIComponent(qq)+'&path='+path).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.summary)}</div>`+
        (d.hits||[]).map(h=>`<div class="event" style="cursor:pointer" data-p="${esc(h.path||'')}" data-kind="${esc(h.kind)}"><div class="h"><span class="score">${h.score}</span> [${esc(h.kind)}] ${esc(h.title)}</div><div class="s">${esc(h.detail)}</div>${h.path?`<div class="meta">→ ${esc(h.path)}</div>`:''}</div>`).join('')||'<div class="empty">No hits — try another keyword</div>';
      out.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{if(e.dataset.p){setSelected(e.dataset.p);setView(e.dataset.kind==='blame-map'?'map':'timeline')}});
    } else if(view==='timeline'){
      const d=await fetch('/api/timeline?path='+path).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.path)} · ${d.total_commits} commits · follow renames</div>`+
        (d.events||[]).map(e=>`<div class="event"><div class="h">${esc(e.commit.short)} · ${esc(e.commit.date)} · ${esc(e.commit.author)} · +${e.insertions}/-${e.deletions}${e.pr_hint?' · '+esc(e.pr_hint):''}</div><div class="s">${esc(e.commit.subject)}</div></div>`).join('')||'<div class="empty">No history</div>';
    } else if(view==='map'){
      const d=await fetch('/api/map?path='+path).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      const total=Math.max(d.total_lines||1,1);
      const strip=(d.blocks||[]).map(b=>`<span style="width:${(b.lines/total)*100}%;background:${COLORS[b.color%8]}" title="${esc(b.author)} L${b.start}-L${b.end}"></span>`).join('');
      out.innerHTML=`<div class="meta">${esc(d.summary)}</div><div class="strip">${strip}</div>`+
        (d.authors||[]).slice(0,6).map(a=>`<div class="owner"><span><span class="dot" style="background:${COLORS[(d.blocks.find(b=>b.author===a.author)||{}).color%8||0]}"></span>${esc(a.author)}</span><span>${a.lines} · ${a.percent.toFixed(1)}%</span></div>`).join('')+
        '<div style="margin-top:.8rem"></div>'+
        (d.blocks||[]).map(b=>`<div class="block" data-hash="${esc(b.hash)}"><div class="h"><span class="dot" style="background:${COLORS[b.color%8]}"></span>L${b.start}–${b.end} · ${esc(b.author)} · ${esc(b.hash)} · ${esc(b.date)}</div><div class="s">${esc(b.preview)}</div></div>`).join('');
    } else if(view==='pr'){
      const qq=document.getElementById('query').value.trim()||'1';
      const d=await fetch('/api/pr?q='+encodeURIComponent(qq)).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.summary)}</div>
        <div class="event"><div class="h">${esc(d.commit.short)} · ${esc(d.commit.date)} · ${esc(d.commit.author)}</div><div class="s">${esc(d.commit.subject)}</div></div>
        <div class="meta" style="margin-top:.7rem">Files</div>`+
        (d.files||[]).map(f=>`<div class="event" style="cursor:pointer" data-p="${esc(f.path)}"><div class="h">+${f.insertions}/-${f.deletions}</div><div class="s">${esc(f.path)}</div></div>`).join('')+
        ((d.later||[]).length?`<div class="meta" style="margin-top:.7rem">Later touches</div>`+(d.later||[]).map(l=>`<div class="event"><div class="h">${esc(l.commit.short)} · ${esc(l.commit.date)} · ${esc(l.path)}</div><div class="s">${esc(l.commit.subject)}</div></div>`).join(''):'');
      out.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{setSelected(e.dataset.p);setView('timeline')});
    } else if(view==='ghosts'){
      const d=await fetch('/api/ghosts').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.summary)}</div>`+
        (d.ghosts||[]).map(g=>`<div class="event"><div class="h risk-${esc(g.risk)}">[${esc(g.risk)}] ${esc(g.author)} · silent ${g.days_silent}d · last ${esc(g.last_commit)} · ${g.owned_files} files</div><div class="s">${esc((g.sample_paths||[]).join(' · '))}</div></div>`).join('')||'<div class="empty">No ghosts — everyone still active</div>'+
        ((d.path_risks||[]).length?`<div class="meta" style="margin-top:.8rem">Path bus factor</div>`+(d.path_risks||[]).map(p=>`<div class="event" style="cursor:pointer" data-p="${esc(p.path)}"><div class="h">bus~${p.bus_factor} · ${esc(p.top_author)} ${p.top_percent.toFixed(0)}%</div><div class="s">${esc(p.path)}</div>${p.warning?`<div class="warn">${esc(p.warning)}</div>`:''}</div>`).join(''):'');
      out.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{setSelected(e.dataset.p);setView('map')});
    } else if(view==='dig'){
      const qq=document.getElementById('query').value.trim();
      if(!qq){out.innerHTML='<div class="empty">Enter a code pattern to dig (e.g. promisor, unwrap!, GIT_NO_LAZY)</div>';return}
      const d=await fetch('/api/dig?q='+encodeURIComponent(qq)).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.summary)}</div>`+
        (d.events||[]).map(e=>`<div class="event" style="cursor:pointer" data-p="${esc((e.files||[])[0]||'')}"><div class="h">[${esc(e.kind)}] ${esc(e.commit.short)} · ${esc(e.commit.date)} · ${esc(e.commit.author)}</div><div class="s">${esc(e.commit.subject)}</div><div class="meta">${esc((e.files||[]).join(' · '))}</div></div>`).join('')||'<div class="empty">Pattern never seen in history</div>';
      out.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{if(e.dataset.p){setSelected(e.dataset.p);setView('timeline')}});
    } else if(view==='pairs'){
      const d=await fetch('/api/pairs').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.summary)}</div>`+
        (d.pairs||[]).map(p=>`<div class="event" style="cursor:pointer" data-p="${esc((p.shared_files||[])[0]||'')}"><div class="h"><span class="score">${p.confidence}</span> fix ${esc(p.fix.short)} — ${esc(p.fix.subject)}</div>${p.break_commit?`<div class="s">break ${esc(p.break_commit.short)} · ${esc(p.break_commit.subject)}</div>`:''}<div class="meta">${esc(p.note)} · ${esc((p.shared_files||[]).join(', '))}</div></div>`).join('')||'<div class="empty">No fix/break pairs found</div>';
      out.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{if(e.dataset.p){setSelected(e.dataset.p);setView('timeline')}});
    } else if(view==='why'){
      const d=await fetch('/api/why?path='+path+'&q='+q).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=(d.suspects||[]).map(s=>`<div class="event"><div class="h"><span class="score">${s.score}</span> ${esc(s.commit.short)} · ${esc(s.commit.date)}</div><div class="s">${esc(s.commit.subject)}</div><div class="meta">${esc((s.reasons||[]).join(' · '))}</div></div>`).join('')||'<div class="empty">No suspects</div>';
    } else if(view==='heatmap'){
      const d=await fetch('/api/heatmap').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      const max=Math.max(...(d.owners||[]).map(o=>o.commits),1);
      out.innerHTML=`<div class="meta">bus factor ~${d.bus_factor}</div>`+(d.warning?`<div class="warn">${esc(d.warning)}</div>`:'')+
        (d.owners||[]).map(o=>`<div class="owner"><span>${esc(o.author)}</span><span>${o.commits} commits</span></div><div class="bar"><i style="width:${(o.commits/max)*100}%"></i></div>`).join('');
    } else if(view==='blast'){
      const d=await fetch('/api/blast?path='+path).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.summary)}</div>`+(d.related||[]).map(h=>`<div class="owner"><span class="filelink" data-p="${esc(h.path)}" style="cursor:pointer;color:var(--accent2)">${esc(h.path)}</span><span>${h.co_changes}×</span></div><div class="bar"><i style="width:${h.affinity*100}%"></i></div>`).join('');
      out.querySelectorAll('.filelink').forEach(a=>a.onclick=()=>{setSelected(a.dataset.p);setView('timeline')});
    } else if(view==='hotspots'){
      const d=await fetch('/api/hotspots').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=(d.hotspots||[]).map(h=>`<div class="event" style="cursor:pointer" data-p="${esc(h.path)}"><div class="h">score ${h.score} · ${h.commits} commits · ${h.authors} authors</div><div class="s">${esc(h.path)}</div></div>`).join('')||'<div class="empty">No hotspots</div>';
      out.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{setSelected(e.dataset.p);setView('timeline')});
    } else if(view==='stale'){
      const d=await fetch('/api/stale').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=(d.files||[]).map(f=>`<div class="event" style="cursor:pointer" data-p="${esc(f.path)}"><div class="h">${f.age_days}d · ${esc(f.last_date)} · ${esc(f.last_author)}</div><div class="s">${esc(f.path)}</div></div>`).join('')||'<div class="empty">No stale files</div>';
      out.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{setSelected(e.dataset.p);setView('timeline')});
    } else if(view==='contributors'){
      const d=await fetch('/api/contributors').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      const max=Math.max(...(d.contributors||[]).map(c=>c.commits),1);
      out.innerHTML=`<div class="meta">${d.total_commits} commits</div>`+(d.contributors||[]).map(c=>`<div class="owner"><span>${esc(c.author)}</span><span>${c.commits} · ${c.percent.toFixed(1)}%</span></div><div class="bar"><i style="width:${(c.commits/max)*100}%"></i></div>`).join('');
    } else {
      const d=await fetch('/api/churn').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      const max=Math.max(...(d.buckets||[]).map(b=>b.commits),1);
      out.innerHTML=(d.buckets||[]).map(b=>`<div class="owner"><span>${esc(b.week)}</span><span>${b.commits}</span></div><div class="bar"><i style="width:${(b.commits/max)*100}%"></i></div>`).join('')||'<div class="empty">No churn data</div>';
    }
  }catch(e){out.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'}
}

document.getElementById('run').onclick=run;
document.getElementById('path').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter'){if(view!=='pr'&&/^\s*#?\d+/.test(e.target.value)) setView('pr'); else run()}});

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(e.key==='j'){focusIdx=Math.min(treeRows.length-1,focusIdx+1);paintFocus();e.preventDefault()}
  else if(e.key==='k'){focusIdx=Math.max(0,focusIdx-1);paintFocus();e.preventDefault()}
  else if(e.key==='Enter'&&focusIdx>=0){activateRow(focusIdx);e.preventDefault()}
  else if(e.key==='b'){setView('map');e.preventDefault()}
  else if(e.key==='p'){setView('pr');e.preventDefault()}
  else if(e.key==='t'){setView('timeline');e.preventDefault()}
  else if(e.key==='g'){setView('ghosts');e.preventDefault()}
  else if(e.key==='h'){setView('hunt');e.preventDefault()}
  else if(e.key==='u'){document.getElementById('btnUpdate').click();e.preventDefault()}
  else if(e.key==='d'){setView('dig');e.preventDefault()}
});

(function boot(){
  const u=new URLSearchParams(location.search);
  if(u.get('path')) setSelected(u.get('path'));
  if(u.get('q')) document.getElementById('query').value=u.get('q');
  if(u.get('view')&&titles[u.get('view')]) view=u.get('view');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===view));
  document.getElementById('outTitle').textContent=titles[view];
  renderPins();
  info().then(loadCached).then(()=>loadTree(selectedPath.includes('/')?selectedPath.replace(/\/[^/]+$/,''):'')).then(run);
})();
</script>
</body>
</html>
