<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Timeforge — Repo Time Machine</title>
<style>
:root{--bg:#070b10;--panel:#0d1520;--line:#1c2e3f;--text:#e8f2f7;--muted:#6d8798;--accent:#5eead4;--accent2:#38bdf8;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#122033 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem}
.hero{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 8px 28px rgba(56,189,248,.35)}
h1{font-size:1.7rem;letter-spacing:-.03em}
.tag{color:var(--muted);font-size:.85rem;margin-top:.2rem}
.open-row{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.open-row input{flex:1;min-width:220px;background:#081018;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:.6rem .75rem;font-size:.8rem}
.open-row button{border:none;border-radius:10px;padding:.6rem 1rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062018}
.tabs{display:flex;gap:.35rem;margin-bottom:1rem;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:.4rem .75rem;border-radius:999px;cursor:pointer;font-size:.72rem;font-weight:600}
.tab.active{color:#062018;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.grid{display:grid;grid-template-columns:300px 1fr;gap:1rem}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:rgba(13,21,32,.9);border:1px solid var(--line);border-radius:16px;padding:1rem}
.panel h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.7rem}
label{display:block;font-size:.72rem;color:var(--muted);margin:.55rem 0 .3rem}
input.ctrl{width:100%;background:#081018;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:.55rem .7rem;font-size:.8rem}
button.primary{margin-top:.85rem;width:100%;border:none;border-radius:10px;padding:.7rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#062018}
.meta{font-size:.78rem;color:var(--muted);margin-bottom:.8rem;word-break:break-all}
.event{padding:.55rem 0;border-bottom:1px dashed #1a2a38}
.event .h{font-family:ui-monospace,monospace;color:var(--accent);font-size:.72rem}
.event .s{font-size:.8rem;margin-top:.15rem}
.bar{height:8px;border-radius:99px;background:#13202c;overflow:hidden;margin:.25rem 0 .45rem}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.owner{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem}
.warn{margin:.6rem 0;padding:.6rem .7rem;border-radius:10px;border:1px solid #fbbf2444;background:#fbbf2411;color:var(--warn);font-size:.75rem}
.empty{color:var(--muted);font-size:.82rem;padding:.5rem 0}
.score{display:inline-block;min-width:2rem;text-align:center;padding:.1rem .3rem;border-radius:6px;background:#fb718522;color:var(--bad);font-weight:700;font-size:.72rem}
.chip{display:inline-block;margin:.15rem .25rem .15rem 0;padding:.25rem .55rem;border-radius:999px;border:1px solid var(--line);font-size:.68rem;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo"></div>
    <div>
      <h1>Timeforge</h1>
      <div class="tag">Any GitHub repo · time machine · hotspots · FounderB</div>
    </div>
  </div>
  <div class="open-row">
    <input id="remoteSpec" placeholder="Open remote: FounderB/SignShield or rust-lang/mdBook"/>
    <button id="btnOpen">Open repo</button>
  </div>
  <div id="cached" style="margin-bottom:1rem"></div>
  <div class="tabs">
    <button class="tab active" data-v="timeline">Time Machine</button>
    <button class="tab" data-v="why">Why broke</button>
    <button class="tab" data-v="heatmap">Heatmap</button>
    <button class="tab" data-v="blast">Blast</button>
    <button class="tab" data-v="hotspots">Hotspots</button>
    <button class="tab" data-v="stale">Stale</button>
    <button class="tab" data-v="contributors">Contributors</button>
    <button class="tab" data-v="churn">Churn</button>
  </div>
  <div class="grid">
    <section class="panel">
      <h2>Controls</h2>
      <div class="meta" id="repoInfo">Loading…</div>
      <label>File path</label>
      <input class="ctrl" id="path" value="README.md"/>
      <label>Keyword (why)</label>
      <input class="ctrl" id="query" placeholder="auth, test, panic…"/>
      <button class="primary" id="run">Run</button>
    </section>
    <section class="panel">
      <h2 id="outTitle">Timeline</h2>
      <div id="out" class="empty">Pick a view and hit Run</div>
    </section>
  </div>
</div>
<script>
let view='timeline';
const titles={timeline:'Timeline',why:'Suspects',heatmap:'Ownership',blast:'Co-changes',hotspots:'Hotspots',stale:'Stale files',contributors:'Contributors',churn:'Weekly churn'};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); view=t.dataset.v;
  document.getElementById('outTitle').textContent=titles[view];
});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function info(){
  const d=await fetch('/api/info').then(r=>r.json());
  document.getElementById('repoInfo').textContent=d.repo+' · v'+d.version;
}
async function loadCached(){
  const list=await fetch('/api/repos').then(r=>r.json()).catch(()=>[]);
  const el=document.getElementById('cached');
  if(!Array.isArray(list)||!list.length){el.innerHTML='';return;}
  el.innerHTML=list.map(r=>`<span class="chip" data-spec="${esc((r.remote||r.id).replace('https://github.com/','').replace('.git',''))}">${esc(r.id)}</span>`).join('');
  el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.getElementById('remoteSpec').value=c.dataset.spec; openRemote();});
}
async function openRemote(){
  const spec=document.getElementById('remoteSpec').value.trim();
  if(!spec) return alert('Paste owner/repo');
  document.getElementById('out').innerHTML='<div class="empty">Cloning / opening '+esc(spec)+'…</div>';
  const r=await fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spec})});
  const d=await r.json();
  if(d.error){alert(d.error);return;}
  await info(); await loadCached(); await run();
}
document.getElementById('btnOpen').onclick=openRemote;
async function run(){
  const path=encodeURIComponent(document.getElementById('path').value.trim()||'README.md');
  const q=encodeURIComponent(document.getElementById('query').value.trim());
  const out=document.getElementById('out');
  out.innerHTML='<div class="empty">Loading…</div>';
  try{
    if(view==='timeline'){
      const d=await fetch('/api/timeline?path='+path).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.path)} · ${d.total_commits} commits</div>`+
        (d.events||[]).map(e=>`<div class="event"><div class="h">${esc(e.commit.short)} · ${esc(e.commit.date)} · ${esc(e.commit.author)} · +${e.insertions}/-${e.deletions}</div><div class="s">${esc(e.commit.subject)}</div></div>`).join('');
    } else if(view==='why'){
      const d=await fetch('/api/why?path='+path+'&q='+q).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=(d.suspects||[]).map(s=>`<div class="event"><div class="h"><span class="score">${s.score}</span> ${esc(s.commit.short)} · ${esc(s.commit.date)}</div><div class="s">${esc(s.commit.subject)}</div><div class="meta">${esc((s.reasons||[]).join(' · '))}</div></div>`).join('')||'<div class="empty">No suspects</div>';
    } else if(view==='heatmap'){
      const d=await fetch('/api/heatmap').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      const max=Math.max(...(d.owners||[]).map(o=>o.commits),1);
      out.innerHTML=`<div class="meta">bus factor ~${d.bus_factor}</div>`+(d.warning?`<div class="warn">${esc(d.warning)}</div>`:'')+
        (d.owners||[]).map(o=>`<div class="owner"><span>${esc(o.author)}</span><span>${o.commits} commits</span></div><div class="bar"><i style="width:${(o.commits/max)*100}%"></i></div>`).join('');
    } else if(view==='blast'){
      const d=await fetch('/api/blast?path='+path).then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=`<div class="meta">${esc(d.summary)}</div>`+(d.related||[]).map(h=>`<div class="owner"><span>${esc(h.path)}</span><span>${h.co_changes}×</span></div><div class="bar"><i style="width:${h.affinity*100}%"></i></div>`).join('');
    } else if(view==='hotspots'){
      const d=await fetch('/api/hotspots').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=(d.hotspots||[]).map(h=>`<div class="event"><div class="h">score ${h.score} · ${h.commits} commits · ${h.authors} authors</div><div class="s">${esc(h.path)}</div></div>`).join('');
    } else if(view==='stale'){
      const d=await fetch('/api/stale').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      out.innerHTML=(d.files||[]).map(f=>`<div class="event"><div class="h">${f.age_days}d · ${esc(f.last_date)} · ${esc(f.last_author)}</div><div class="s">${esc(f.path)}</div></div>`).join('')||'<div class="empty">No stale files</div>';
    } else if(view==='contributors'){
      const d=await fetch('/api/contributors').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      const max=Math.max(...(d.contributors||[]).map(c=>c.commits),1);
      out.innerHTML=`<div class="meta">${d.total_commits} commits</div>`+(d.contributors||[]).map(c=>`<div class="owner"><span>${esc(c.author)}</span><span>${c.commits} · ${c.percent.toFixed(1)}%</span></div><div class="bar"><i style="width:${(c.commits/max)*100}%"></i></div>`).join('');
    } else {
      const d=await fetch('/api/churn').then(r=>r.json());
      if(d.error) throw new Error(d.error);
      const max=Math.max(...(d.buckets||[]).map(b=>b.commits),1);
      out.innerHTML=(d.buckets||[]).map(b=>`<div class="owner"><span>${esc(b.week)}</span><span>${b.commits}</span></div><div class="bar"><i style="width:${(b.commits/max)*100}%"></i></div>`).join('')||'<div class="empty">No churn data</div>';
    }
  }catch(e){out.innerHTML='<div class="empty">'+esc(e.message||e)+'</div>';}
}
document.getElementById('run').onclick=run;
info().then(loadCached).then(run);
</script>
</body>
</html>
